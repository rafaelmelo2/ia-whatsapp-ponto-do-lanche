  #   volumes:
  #     - ./src/data/cliente-2:/app/src/data/cliente-2
  #     - ./src/clients/cliente-2:/app/src/clients/cliente-2:ro
  #     - ./logs:/app/logs
  #   ports:
  #     - "3001:3000"
